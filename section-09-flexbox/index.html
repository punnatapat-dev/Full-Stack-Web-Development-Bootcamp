<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Flexbox Preistabelle</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Sono', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }

    /* Flexbox Container */
    .pricing-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 2rem;
      padding: 2rem;
      box-sizing: border-box;
    }

    /* Pricing Card (Allgemein) */
    .pricing-plan {
      flex: 1;
      max-width: 400px;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    /* Farbvarianten */
    .pricing-plan.basic {
      background-color: #f2f2f2;
    }

    .pricing-plan.standard {
      background-color: #e6f2ff;
      border: 2px solid #3399ff;
    }

    .pricing-plan.premium {
      background-color: #fff4cc;
      border: 2px solid #ffcc00;
      transform: scale(1.05);
    }

    /* Titel */
    .plan-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Preis */
    .plan-price {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .plan-vat {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    /* Features */
    .plan-features {
      list-style: none;
      padding: 0;
      margin: 0 0 25px 0;
    }

    .plan-features li {
      margin-bottom: 12px;
      font-size: 16px;
    }

    /* Button */
    .plan-button {
      padding: 12px 25px;
      background-color: #ff6600;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    .plan-button:hover {
      background-color: #e65c00;
    }

    /* Responsive */
    @media (max-width: 1250px) {
      .pricing-container {
        flex-direction: column;
        height: auto;
      }

      .pricing-plan.premium {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="pricing-container">

    <!-- Basic -->
    <div class="pricing-plan basic">
      <div class="plan-title">Basic</div>
      <div class="plan-price">11,99 € / Monat</div>
      <div class="plan-vat">inkl. MwSt.</div>
      <ul class="plan-features">
        <li>✅ 10 GB Speicher</li>
        <li>✅ 1 Benutzer</li>
        <li>🚫 Kein Support</li>
      </ul>
      <button class="plan-button">Jetzt buchen</button>
    </div>

    <!-- Standard -->
    <div class="pricing-plan standard">
      <div class="plan-title">Standard</div>
      <div class="plan-price">19,99 € / Monat</div>
      <div class="plan-vat">inkl. MwSt.</div>
      <ul class="plan-features">
        <li>✅ 50 GB Speicher</li>
        <li>✅ 5 Benutzer</li>
        <li>✅ E-Mail &amp; Telefonsupport</li>
      </ul>
      <button class="plan-button">Jetzt buchen</button>
    </div>

    <!-- Premium -->
    <div class="pricing-plan premium">
      <div class="plan-title">Premium</div>
      <div class="plan-price">49,99 € / Monat</div>
      <div class="plan-vat">inkl. MwSt.</div>
      <ul class="plan-features">
        <li>✅ 100 GB Speicher</li>
        <li>✅ 10 Benutzer</li>
        <li>✅ 24/7 Support</li>
      </ul>
      <button class="plan-button">Jetzt buchen</button>
    </div>

  </div>

</body>

</html>
